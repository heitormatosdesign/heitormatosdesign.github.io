name: Estatísticas do painel

# Busca os números do GoatCounter de hora em hora, criptografa com a senha
# do painel e publica no branch "dados" (lido pela página /admin/).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estatisticas
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar biblioteca de criptografia
        run: pip install --quiet "cryptography>=43"

      - name: Gerar resumo criptografado
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python .github/scripts/estatisticas.py "$RUNNER_TEMP/estatisticas.json"

      - name: Publicar no branch dados
        run: |
          cd "$RUNNER_TEMP"
          rm -rf dados && mkdir dados && cd dados
          cp ../estatisticas.json .
          git init -q -b dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estatisticas.json
          git commit -q -m "Estatísticas criptografadas"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
